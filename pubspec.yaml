name: okhati
description: Okhati - smart medicine routine and home medicine manager.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.5.1
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.0
  # Added in later sprints (verify versions on pub.dev first):
  # firebase_storage, firebase_messaging, cloud_functions   (S3 / S7-8)
  # mobile_scanner, google_mlkit_text_recognition, image_picker (S6)
  # flutter_tts, pdf, printing                              (Could)
  pdf: ^3.10.4
  printing: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
