name: okhati
description: "Okhati — medicine routine + home medicine cabinet (UI/UX phase, MVVM)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.0.0
  intl: ^0.20.3
  material_symbols_icons: ^4.0.0
  cupertino_icons: ^1.0.8
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/images/mock/
    - assets/illustrations/
    - assets/icons/
    - assets/fonts/
